<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cleanprofs · Bel Colin (demo)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#005BB1;--blue-dark:#00427f;--green:#64B300;--green-light:#8CDB28}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Poppins,system-ui,sans-serif;color:#fff;
    background:linear-gradient(140deg,var(--blue) 0%,#0a73d1 65%,#1a86e0 100%)}
  header{padding:22px 24px}
  .logo{font-weight:800;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  .logo i{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--green);transform:rotate(-45deg)}
  main{flex:1;display:grid;place-items:center;text-align:center;padding:24px 16px 96px}
  h1{font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 14px;font-weight:800}
  h1 span{color:var(--green-light)}
  p{font-size:18px;margin:0 auto 32px;max-width:460px;opacity:.95}
  .call{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:40px;padding:18px 38px;background:var(--green);color:#fff;
    font:600 19px Poppins,sans-serif;cursor:pointer;box-shadow:0 12px 30px rgba(0,30,70,.3)}
  .call:hover{filter:brightness(1.06)}
  .or{display:block;margin-top:18px;font-size:14px;opacity:.85}

  .demo-tag{position:fixed;right:16px;top:16px;z-index:20;background:#111;color:#fff;font:500 12px/1.35 Poppins,sans-serif;
    border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .demo-tag b{color:var(--green-light)}
  .demo-tag button{background:#fff;color:#111;border:0;border-radius:8px;padding:5px 9px;font:600 12px Poppins,sans-serif;cursor:pointer}

  /* The call-only widget: a phone screen over the page */
  .phone-backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,20,35,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .phone-backdrop.open{display:flex}
  .phone{position:relative;width:min(360px,100%);height:min(620px,calc(100vh - 32px));border-radius:34px;overflow:hidden;
    background:#0f1720;box-shadow:0 30px 80px rgba(0,0,0,.45);border:8px solid #1c2633}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .phone-close{position:absolute;top:10px;right:12px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
    color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
  <header><div class="logo"><i></i>CLEANPROFS</div></header>

  <main>
    <div>
      <h1>Vraag over uw <span>reiniging</span>?</h1>
      <p>Niet gereinigd, wanneer we weer komen of een vraag over uw factuur: bel Colin, hij neemt direct op.</p>
      <button class="call" data-call>📞 Bel Colin</button>
      <span class="or">of chat linksonder</span>
    </div>
  </main>

  <div class="demo-tag"><span><b>Demo</b> · gebouwd door Neople</span><button id="newcall">Nieuw gesprek</button></div>

  <div class="phone-backdrop" id="phone" aria-hidden="true">
    <div class="phone" role="dialog" aria-label="Bellen met Colin">
      <button class="phone-close" id="phone-close" aria-label="Sluiten">×</button>
      <iframe id="phone-frame" title="Bellen met Colin" allow="microphone; autoplay"></iframe>
    </div>
  </div>

<script>
  // ?nieuw=1 starts a fresh conversation: forget the widget's stored session.
  (function () {
    var u = new URL(location.href);
    if (u.searchParams.get('nieuw') === '1') {
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('nc') === 0) localStorage.removeItem(k); }); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      u.searchParams.delete('nieuw');
      history.replaceState(null, '', u);
    }
  })();
  window.NeopleChat = window.NeopleChat || { q: [] };
  ['open','close','toggle','identify','setContext','on','shutdown'].forEach(function (m) {
    if (!window.NeopleChat[m]) window.NeopleChat[m] = function () { window.NeopleChat.q.push([m].concat([].slice.call(arguments))); };
  });
</script>
<script src="https://chat.endpoints.neople-chat.cloud.goog/v1/widget.js" data-widget="wk_N9ZxoZ0p-mtGv0F5xaKU31" data-language="nl" async></script>
<script>
  // "Bel Colin": the call-only page of Neople Chat (/p/{key}), as a phone screen over the page. It calls at once.
  var PHONE_URL = 'https://chat.endpoints.neople-chat.cloud.goog/p/wk_N9ZxoZ0p-mtGv0F5xaKU31?lang=nl&autostart=1';
  var phone = document.getElementById('phone');
  var phoneFrame = document.getElementById('phone-frame');
  function call() {
    try { window.NeopleChat.close(); } catch (e) {}
    phoneFrame.src = PHONE_URL;
    phone.classList.add('open');
    phone.setAttribute('aria-hidden', 'false');
  }
  function hangUp() {
    // Taking the page away ends the call: the microphone and the connection go with it.
    phoneFrame.src = 'about:blank';
    phone.classList.remove('open');
    phone.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('phone-close').addEventListener('click', hangUp);
  phone.addEventListener('click', function (event) { if (event.target === phone) hangUp(); });
  document.querySelectorAll('[data-call]').forEach(function (b) { b.addEventListener('click', call); });
  document.getElementById('newcall').addEventListener('click', function () {
    try { window.NeopleChat.shutdown(); } catch (e) {}
    setTimeout(function () { var u = new URL(location.href); u.searchParams.set('nieuw', '1'); location.assign(u); }, 400);
  });
</script>
</body>
</html>
